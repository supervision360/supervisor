<title>Portal Supervisor Tigo — Ingreso</title>
<style>
  :root{ --navy:#003575; --navy-dark:#00224d; --blue:#3c62ac; --amber:#f0a500; --ink:#334155; --muted:#62646e; --line:#d9dbe0; --bad:#a3261c; --bad-bg:#f8e3e0;
    --font:"Helvetica Neue","Hanken Grotesk",Helvetica,Arial,sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; font:400 16px/1.6 var(--font); background:#f2f2f2; color:var(--ink); }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  header{ background:#fff; border-bottom:1px solid var(--line); }
  .brand-row{ max-width:1400px; margin:0 auto; padding:8px 24px; min-height:72px; display:flex; align-items:center; gap:18px; }
  .brand-row img{ height:40px; width:auto; display:block; }
  .brand-divider{ width:1px; height:34px; background:var(--line); }
  .brand-name{ font:300 18px/1.1 var(--font); letter-spacing:.12em; text-transform:uppercase; color:var(--blue); }
  .brand-name strong{ font-weight:700; color:var(--navy); }
  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px; background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%); }
  .tarjeta{ width:100%; max-width:400px; background:#fff; border-top:3px solid var(--amber); padding:32px 32px 28px; }
  .etiqueta{ font:600 11px/1.3 var(--font); letter-spacing:.14em; text-transform:uppercase; color:var(--blue); margin:0 0 6px; }
  h1{ font:300 26px/1.2 var(--font); color:var(--navy); margin:0 0 6px; }
  h1 strong{ font-weight:700; }
  .bajada{ font-size:14px; color:var(--muted); margin:0 0 22px; }
  label.mantener{ display:flex; align-items:center; gap:8px; margin:16px 0 0; font:400 14px/1.3 var(--font); letter-spacing:0; text-transform:none; color:var(--ink); cursor:pointer; }
  label.mantener input{ width:16px; height:16px; margin:0; padding:0; }
  label{ display:block; font:600 11px/1.3 var(--font); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
  input{ width:100%; padding:11px 12px; font:400 16px/1.3 var(--font); color:var(--ink); border:1px solid #b9c0cc; border-radius:2px; background:#fff; }
  button{ width:100%; margin-top:22px; padding:12px; font:600 13px/1 var(--font); letter-spacing:.1em; text-transform:uppercase; color:#fff; background:var(--navy); border:0; border-radius:2px; cursor:pointer; }
  button:hover{ background:var(--navy-dark); }
  button:disabled{ opacity:.6; cursor:default; }
  .aviso{ display:none; margin-top:16px; padding:10px 12px; font-size:14px; color:var(--bad); background:var(--bad-bg); border-left:3px solid var(--bad); }
  .prueba{ margin:0 0 16px; padding:8px 10px; font-size:12.5px; color:#9a5b00; background:#fdf1d8; border-left:3px solid var(--amber); }
  .abriendo{ display:none; flex:1; align-items:center; justify-content:center; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  html.con-sesion main, html.con-sesion footer{ display:none; }
  html.con-sesion .abriendo{ display:flex; }
  footer{ background:#fff; border-top:1px solid var(--line); text-align:center; padding:10px 24px; font-size:7.5px; color:var(--muted); letter-spacing:.06em; }
  @media (max-width:560px){ .brand-row img{ height:30px; } .brand-name{ font-size:14px; } .tarjeta{ padding:24px 20px; } }</style>
</head>

<script>
// Cliente de acceso (navegador). Lo incrustan la pantalla de ingreso de las
// paginas protegidas (plantilla-acceso.html) y la pagina de administracion
// (plantilla-admin.html). Habla con Supabase por su API REST, sin librerias.
// El supervisor escribe solo "usuario" y clave: por dentro el usuario es el
// correo ficticio usuario@DOMINIO, porque Supabase exige un correo.
const Acceso = (() => {
  const CLAVE_SESION = 'portal_sesion';
  const CLAVE_USUARIO = 'portal_usuario';   // ultimo usuario que entro en este navegador (nunca la clave)
  const CLAVE_MANTENER = 'portal_mantener'; // '1' si marco "Mantener la sesion iniciada"
  const DURACION_MS = 12 * 60 * 60 * 1000;  // pasado este tiempo se pide la clave de nuevo
  const DURACION_LARGA_MS = 30 * 24 * 60 * 60 * 1000; // si marco "Mantener la sesion iniciada"
  let cfg = { url: '', key: '', dominio: 'portal.local' };

  function configurar(c) { cfg = Object.assign(cfg, c); }

  async function pedir(metodo, ruta, cuerpo, token) {
    const headers = { apikey: cfg.key };
    if (token) headers.Authorization = 'Bearer ' + token;
    if (cuerpo !== undefined) headers['Content-Type'] = 'application/json';
    const r = await fetch(cfg.url + ruta, { method: metodo, headers, body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo) });
    let datos = null;
    try { datos = await r.json(); } catch (e) { /* respuesta sin cuerpo */ }

    try {

  function guardarSesion(d, desde, dura) {
    const sesion = { rt: d.refresh_token, desde, dura, at: d.access_token, vence: Date.now() + (d.expires_in || 3600) * 1000 };

  }

  function ultimoUsuario() { try { return localStorage.getItem(CLAVE_USUARIO) || ''; } catch (e) { return ''; } }

      throw new Error('El servicio de acceso respondió ' + r.estado);

    recordarMantener(mantener);
    guardarSesion(r.datos, Date.now(), mantener ? DURACION_LARGA_MS : DURACION_MS);

  async function retomar(renovar) {

      const otra = leerSesion();

      // servicio no debe obligar a escribir la clave otra vez.
      if (r.estado === 400 || r.estado === 401 || r.estado === 403) { salir(); return null; }

        + '<label style="' + rotulo + '">Repite la clave nueva</label><input type="password" autocomplete="new-password" minlength="8" required style="' + campo + '">'

// Pide la llave con la sesion ya iniciada. Devuelve false si hay que mostrar el formulario.
async function ingresarCon(token) {
  const r = await Acceso.rpc('ingresar', { p_pagina: CFG.pagina, p_kid: CFG.kid }, token);
  if (!r.ok || !r.datos) throw new Error('No se pudo validar el ingreso (' + r.estado + ')');
  if (r.datos.motivo === 'cambiar_clave') {
    await Acceso.pedirClaveNueva(token);
    return ingresarCon(token);
  }
  if (!r.datos.ok) {
    // Una pagina desactualizada no es motivo para cerrar la sesion.
    if (r.datos.motivo !== 'sin_llave') Acceso.salir();
    avisar(r.datos.motivo === 'inactivo' ? 'Tu usuario está desactivado. Habla con el administrador.'
      : r.datos.motivo === 'sin_llave' ? 'Esta página está desactualizada. Recárgala en unos minutos.'
      : 'Tu usuario no tiene acceso a esta página.');
    return false;
  }
  // Llego desde la administracion sin sesion: tras ingresar vuelve alla.
  if (r.datos.rol === 'admin' && new URLSearchParams(location.search).get('ir') === 'admin') {
    location.replace('admin.html' + location.hash);
    return true;
  }
  await abrirPagina(r.datos.llave, r.datos.nombre || r.datos.usuario, r.datos.rol);
  return true;
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  avisar('');
  ocupado(true);
  const usuario = Acceso.normalizarUsuario(document.getElementById('usuario').value);
  const clave = document.getElementById('clave').value;
  try {
    if (CFG.llavePrueba) { await abrirPagina(CFG.llavePrueba, usuario + ' (prueba)', usuario === 'admin' ? 'admin' : ''); return; }
    const token = await Acceso.entrar(usuario, clave, document.getElementById('mantener').checked);
    if (!token) {
      Acceso.rpc('registrar_fallo', { p_usuario: usuario, p_pagina: CFG.pagina }).catch(() => {});
      avisar('Usuario o clave incorrectos.');
    } else {
      await ingresarCon(token);
    }
  } catch (err) {
    avisar('No se pudo ingresar: ' + err.message + '. Revisa tu conexión e intenta de nuevo.');
  }
  ocupado(false);
});

(async () => {
  if (CFG.llavePrueba) { document.documentElement.className = ''; document.getElementById('avisoPrueba').style.display = 'block'; return; }
  try {
    ocupado(true);
    let token = await Acceso.retomar();
    if (token) {
      let abierta = false;
      try { abierta = await ingresarCon(token); } catch (err) {
        // El token guardado ya no sirve: se pide uno nuevo y se reintenta.
        token = await Acceso.retomar(true);
        if (token) abierta = await ingresarCon(token);
      }
      if (abierta) return;
    }
  } catch (err) { /* sin sesion valida: queda el formulario */ }
  document.documentElement.className = '';
  ocupado(false);
})();
</script>
